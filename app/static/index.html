<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concesionaria IA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f1f3f5; height: 100vh; display: flex; justify-content: center; }
  .app { width: 100%; max-width: 720px; display: flex; flex-direction: column; background: #fff; box-shadow: 0 0 20px rgba(0,0,0,.08); }
  header { padding: 16px 20px; background: #0b3d91; color: #fff; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .8; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; font-size: 15px; flex-shrink: 0; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: #0b3d91; color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: none; color: #1a1a1a; padding-left: 0; max-width: 100%; }
  .bot p { margin: 0 0 8px; } .bot p:last-child { margin: 0; }
  .bot table { border-collapse: collapse; font-size: 13px; margin: 6px 0; display: block; max-width: 100%; overflow-x: auto; }
  .bot th, .bot td { border: 1px solid #cdd3da; padding: 4px 8px; text-align: left; }
  .bot th { background: #dde3ea; }
  .bot ul, .bot ol { margin: 4px 0 8px; padding-left: 22px; }
  .bot h1, .bot h2, .bot h3 { font-size: 15px; margin: 10px 0 4px; }
  .typing { opacity: .6; font-style: italic; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e3e6ea; }
  input { flex: 1; padding: 12px; border: 1px solid #cdd3da; border-radius: 10px; font-size: 15px; }
  button { padding: 0 20px; border: 0; border-radius: 10px; background: #0b3d91; color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Asistente de la concesionaria</h1>
    <p>Consultá stock, precios y agendá tu test drive</p>
  </header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="Escribí tu consulta..." autocomplete="off" autofocus>
    <button id="btn">Enviar</button>
  </form>
</div>
<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const btn = document.getElementById("btn");
  const sessionId = crypto.randomUUID();

  function agregar(texto, clase, markdown = false) {
    const div = document.createElement("div");
    div.className = "msg " + clase;
    if (markdown) div.innerHTML = DOMPurify.sanitize(marked.parse(texto));
    else div.textContent = texto;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  agregar("¡Hola! Soy el asistente virtual. Contame qué auto buscás o si querés agendar un test drive.", "bot");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const texto = input.value.trim();
    if (!texto) return;
    input.value = "";
    agregar(texto, "user");
    btn.disabled = true;
    const espera = agregar("Escribiendo...", "bot typing");
    try {
      const r = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, mensaje: texto }),
      });
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      espera.remove();
      agregar(data.respuesta, "bot", true);
    } catch (err) {
      espera.remove();
      agregar("Hubo un problema al conectar. Probá de nuevo en un momento.", "bot");
    } finally {
      btn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
